spring.application.name=pawn

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/pawnbroking
spring.datasource.username=postgres
spring.datasource.password=Sai@2003
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate


spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000


spring.cache.type=caffeine
spring.cache.cache-names=customers,contacts,idProofs,addresses,relatives
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=60m

# JWT Configuration
jwt.secret=0123456789012345678901234567890132456765473890876
jwt.expiration=36000000
